name: track_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  amap_map: ^1.0.15  # 地图依赖
  x_amap_base: ^1.0.3 # 基础依赖
  permission_handler: 12.0.3 # 权限依赖
  url_launcher: ^6.0.3
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  path: ^1.9.1
  flutter_slidable: ^4.0.3
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.26

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/icon-v1.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true



